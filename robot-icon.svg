    <rect x="398" y="88" width="204" height="166" rx="83" fill="#182333"/>
    <rect x="428" y="114" width="144" height="114" rx="57" fill="#ED8D78"/>
    <rect x="122" y="455" width="120" height="180" rx="55" fill="#182333"/>
    <rect x="758" y="455" width="120" height="180" rx="55" fill="#182333"/>
    <rect x="178" y="285" width="644" height="530" rx="184" fill="#182333"/>
    <rect x="216" y="323" width="568" height="454" rx="150" fill="#A7E5D1"/>
    <rect x="310" y="486" width="380" height="156" rx="75" fill="#293344"/>
    <circle cx="420" cy="561" r="25" fill="#F8F6EF"/>
    <circle cx="580" cy="561" r="25" fill="#F8F6EF"/>
    <rect x="478" y="609" width="44" height="13" rx="6.5" fill="#FFD365"/>
