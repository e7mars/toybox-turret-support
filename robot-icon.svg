<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Toybox mascot">
  <!-- Store icons are opaque. This same hand-drawn mascot is rendered into every PNG by scripts/generate-brand-assets.cjs. -->
  <rect width="1024" height="1024" fill="#293344"/>
  <g transform="translate(-10.24 -10.24) scale(1.02)">
    <!-- A single friendly robot face: clean enough for an app tile, tactile enough for a toy game. -->
